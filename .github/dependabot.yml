# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    ignore:
      # @ionic/react-router 9 requires React Router ">=6.4.0 <7"
      - dependency-name: "react-router"
        versions: [">=7.0.0"]
      - dependency-name: "react-router-dom"
        versions: [">=7.0.0"]
      # 9.4.2 hides the collapsed header back button in iOS 26 mode
      - dependency-name: "@rdlabo/ionic-theme-ios26"
        versions: ["9.4.2"]
      # eslint-plugin-react does not yet support ESLint 10
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
      - dependency-name: "@eslint/js"
        versions: [">=10.0.0"]
      # typescript-eslint supports TypeScript "<6.1.0" (TypeScript 7 has no JS compiler API)
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
    labels:
      - "frontend"
      - "enhancement"
    groups:
      dev-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "nuget"
    directory: "/backend"
    schedule:
      interval: "monthly"
    ignore:
      # Swashbuckle.AspNetCore requires Microsoft.OpenApi "<3.0.0"
      - dependency-name: "Microsoft.OpenApi"
        versions: [">=3.0.0"]
      # 3.2.0+ fails Release builds without a Six Labors license key
      - dependency-name: "SixLabors.ImageSharp"
        versions: [">=3.2.0"]
    labels:
      - "backend"
      - "enhancement"
    groups:
      dev-dependencies:
        patterns:
          - "*"
